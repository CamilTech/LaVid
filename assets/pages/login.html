<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/pages-css/logincad.css">
  <title>Document</title>
</head>

<body>
  <main>

    <div class="logotype"></div>

    <div class="login-info">
      <h1>Entrar</h1>

      <form action="post" id="form-login">

        <label for="email">Email: </label> <br>
        <input type="email" required> <br>

        <label for="password">Senha: </label> <br>
        <input type="password" required> <br>

      </form>

    </div>

    <div class="cadastro">
      <p>Não tem conta? </p> <a href="../pages/cadastro.html"> <u>Cadastre-se</u></a>
    </div>

    <button class="btn-send" id="btn-login" form="form-login"><b>Entrar</b></button>

    <div class="login-com">

      <div class="icon">
        <a href><img src="https://cdn-icons-png.flaticon.com/512/59/59439.png" alt></a>
      </div>

      <div class="icon">
        <a href><img src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/google-black-icon.png" alt></a>
      </div>

      <div class="icon">
        <a href><img src="https://cdn-icons-png.flaticon.com/512/0/747.png" alt></a>
      </div>

    </div>


  </main>
</body>
</html>
